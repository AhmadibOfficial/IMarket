# Local development only. Port is loopback-bound; no real financial data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imarket
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: imarket
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - imarket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imarket -d imarket"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  imarket_pgdata:
