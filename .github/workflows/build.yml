name: IMarket safe automated build
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: imarket_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: imarket_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imarket_test -d imarket_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMARKET_TEST_DATABASE_URL: postgres://imarket_test:synthetic_ci_only@127.0.0.1:5432/imarket_test_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check policies and offline domain unit tests
        run: npm run check:offline
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Authentication, tenant and inventory PostgreSQL tests
        run: npm run validate:milestone
      - name: Compile NestJS and Next.js (no deploy)
        run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
